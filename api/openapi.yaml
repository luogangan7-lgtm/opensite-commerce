components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-osc_admin_session
      description: >-
        Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain on a dedicated admin host. Unsafe cookie-authenticated
        requests require exact Origin and a session-bound HMAC X-CSRF-Token; API-key bearer requests do not require
        CSRF.
    CartToken:
      type: apiKey
      in: header
      name: X-Cart-Token
      description: 256-bit base64url guest cart capability. Trusted customer resolution is an optional server-only seam.
    ApiKeyBearer: {type: http, scheme: bearer, bearerFormat: API-Key}
  parameters:
    CartId:
      name: cart_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkuId:
      name: sku_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
        minLength: 43
        maxLength: 43
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: Target tenant UUID from the URL; credentials still require matching membership and scope. An
        API key must belong to this exact tenant.
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      description: Session owned by the caller; never a token.
      schema:
        type: string
        format: uuid
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the dedicated admin origin; login also requires the anonymous pre-login CSRF
        token.
      schema:
        type: string
        format: uri
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Signed HMAC bound to the current session, or short-lived anonymous material before login. Unsigned
        double-submit is not accepted.
      schema:
        type: string
        minLength: 1
    OriginIfCookie:
      name: Origin
      in: header
      required: false
      description: Required and checked for exact admin origin when authenticating with adminSession. API-key bearer
        requests are exempt from the cookie CSRF/Origin checks.
      schema:
        type: string
        format: uri
    CSRFTokenIfCookie:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required session-bound HMAC CSRF token when authenticating with adminSession; not required for
        API-key bearer calls.
      schema:
        type: string
        minLength: 1
    SiteId:
      name: site_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DraftId:
      name: draft_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Scoped per (actor, operation, key) with a stored request hash (007_reliability). The hash covers the canonical
        request: method, path template, resolved path parameters (e.g. upload_id, draft_id), canonicalized query
        and the body (empty body hashes as empty), so one key reused across different resources is a different request.
        Same key + same request after completion replays the original response; same key while the original request
        is still in progress returns 409 (Problem code `idempotency_in_progress`); same key + different request
        (path, query or body) returns 422 (Problem code `idempotency_key_reused`). Every operation taking this header
        declares 409 and 422.
      schema: {type: string, minLength: 1, maxLength: 128}
    VariantId:
      name: variant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque base64url created_at/id cursor from the prior response.
      schema:
        type: string
        maxLength: 512
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReturnId:
      name: return_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: BadRequest
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: NotFound
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: ServiceUnavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication missing or invalid; bad login credentials are indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Origin, CSRF, tenant membership, API-key tenant binding or required scope denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict, including idempotency_in_progress.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match precondition failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the admission limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Unsupported request media type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validation failure or idempotency_key_reused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required precondition such as If-Match is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: RFC 9457 error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CreateCart:
      type: object
      additionalProperties: false
      required:
      - currency
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          minLength: 3
          maxLength: 3
    SetCartLine:
      type: object
      additionalProperties: false
      required:
      - quantity
      properties:
        quantity:
          description: Absolute quantity; zero deletes the line.
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
    CartLine:
      type: object
      additionalProperties: false
      # A line carries either a complete quote or pricing_error, never both or neither.
      if: {required: [pricing_error]}
      then:
        not:
          anyOf:
          - required: [unit_amount]
          - required: [line_amount]
          - required: [price_list_id]
          - required: [priority]
          - required: [min_quantity]
      else: {required: [unit_amount, line_amount, price_list_id, priority, min_quantity]}
      required:
      - sku_id
      - quantity
      - available_quantity
      - sellable
      properties:
        sku_id: &id001
          type: string
          format: uuid
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        unit_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        line_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        price_list_id: *id001
        priority:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
        min_quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        available_quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        sellable:
          type: boolean
        pricing_error:
          type: string
          enum: [price_unavailable, amount_overflow]
          description: Quote is unavailable; monetary and selected price fields are omitted.
    Cart:
      type: object
      additionalProperties: false
      # A cart is either fully priced (subtotal) or not (pricing_error), never both or neither.
      if: {required: [pricing_error]}
      then: {not: {required: [subtotal]}}
      else: {required: [subtotal]}
      required:
      - id
      - currency
      - version
      - lines
      properties:
        id: *id001
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        lines:
          type: array
          maxItems: 1000
          description: At most 1000 distinct SKUs, so the representation fits the 1 MiB response buffer.
          items:
            $ref: '#/components/schemas/CartLine'
        subtotal:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        pricing_error:
          type: string
          enum: [price_unavailable, amount_overflow]
          description: Cart is not fully priced; subtotal is omitted.
    CreatedCart:
      type: object
      additionalProperties: false
      required:
      - cart
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        cart_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
    CreateAdminSession:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      additionalProperties: false
    CurrentActor:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
      additionalProperties: false
    AdminSession:
      type: object
      required:
        - id
        - created_at
        - expires_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        is_current:
          type: boolean
      additionalProperties: false
    AdminSessionCreated:
      type: object
      required:
        - actor
        - session
        - csrf_token
      properties:
        actor:
          $ref: '#/components/schemas/CurrentActor'
        session:
          $ref: '#/components/schemas/AdminSession'
        csrf_token:
          type: string
          minLength: 1
          description: Session-bound HMAC CSRF material; never the authentication bearer token.
      additionalProperties: false
    AdminSessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AdminSession'
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
      additionalProperties: true
    CreateOrganization:
      type: object
      required: [display_name]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 200}
        legal_name: {type: string, maxLength: 200}
      additionalProperties: false
    Organization:
      type: object
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        legal_name: {type: string}
      additionalProperties: false
    CreateSite:
      type: object
      required: [organization_id, name, default_locale]
      properties:
        organization_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        default_locale: {type: string, minLength: 2, maxLength: 20}
      additionalProperties: false
    Site:
      type: object
      required: [id, organization_id, name, default_locale, status]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        name: {type: string}
        default_locale: {type: string}
        status: {type: string, enum: [draft, published]}
        published_release_id: {type: [string, 'null'], format: uuid}
      additionalProperties: false
    CreateProduct:
      type: object
      required: [product_code]
      properties:
        product_code: {type: string, minLength: 1, maxLength: 128}
      additionalProperties: false
    Product:
      type: object
      required:
      - id
      - product_code
      - lifecycle_status
      - version
      - created_at
      properties:
        id:
          type: string
          format: uuid
        product_code:
          type: string
        lifecycle_status:
          type: string
          enum:
          - draft
          - ready
          - archived
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    CreateVariant:
      type: object
      required: [sku, option_value_ids]
      properties:
        sku: {type: string, minLength: 1, maxLength: 128}
        option_value_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
      additionalProperties: false
    Variant:
      type: object
      required:
      - id
      - product_id
      - sku
      - lifecycle_status
      - version
      - created_at
      - option_value_ids
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        lifecycle_status:
          type: string
          enum:
          - draft
          - ready
          - archived
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        option_value_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
    CreateUpload:
      type: object
      required:
      - filename
      - size_bytes
      - sha256
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 0
          format: int64
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        declared_mime:
          type: string
      additionalProperties: false
    UploadSession:
      type: object
      required:
      - id
      - status
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - reserved
          - uploading
          - verifying
          - stored
          - processing
          - ready
          - failed
        media_id:
          type:
          - string
          - 'null'
          format: uuid
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    CreateDraft:
      type: object
      properties:
        base_release_id: {type: [string, 'null'], format: uuid}
      additionalProperties: false
    Draft:
      type: object
      required: [id, revision, status]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [open, published, abandoned]}
      additionalProperties: false
    PageDocument:
      type: object
      required: [schema_version, root_id, nodes]
      properties:
        schema_version: {type: integer, const: 1}
        root_id: {type: string, minLength: 1}
        nodes:
          type: object
          maxProperties: 200
          minProperties: 1
          additionalProperties: {$ref: '#/components/schemas/ComponentNode'}
      additionalProperties: false
    ComponentNode:
      type: object
      required: [component, props, slots]
      properties:
        component:
          type: string
          enum: [core.page-layout@1, core.section@1, core.hero@1, catalog.product-grid@1, company.profile@1]
        props: {type: object}
        binding: {$ref: '#/components/schemas/DataBinding'}
        slots:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
      additionalProperties: false
    DataBinding:
      type: object
      required: [resolver, params]
      properties:
        resolver: {type: string, enum: [catalog.featured-products@1, catalog.collection-products@1, company.profile@1]}
        params: {type: object}
      additionalProperties: false
    OperationBatch:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/PageOperation'}
      additionalProperties: false
    PageOperation:
      oneOf:
        - $ref: '#/components/schemas/ComponentAdd'
        - $ref: '#/components/schemas/ComponentMove'
        - $ref: '#/components/schemas/ComponentSetProps'
      discriminator:
        propertyName: type
        mapping:
          component.add: '#/components/schemas/ComponentAdd'
          component.move: '#/components/schemas/ComponentMove'
          component.set_props: '#/components/schemas/ComponentSetProps'
    ComponentAdd:
      type: object
      required: [operation_id, type, target, arguments]
      properties:
        operation_id: {type: string, format: uuid}
        type: {type: string, const: component.add}
        target:
          type: object
          required: [page_key]
          properties:
            page_key: {type: string, minLength: 1}
          additionalProperties: false
        arguments:
          type: object
          required: [component, node_id, parent_node_id, slot, props]
          properties:
            component: {type: string, minLength: 1}
            node_id: {type: string, minLength: 1}
            parent_node_id: {type: string, minLength: 1}
            slot: {type: string, minLength: 1}
            props: {type: object}
            binding: {$ref: '#/components/schemas/DataBinding'}
          additionalProperties: false
      additionalProperties: false
    ComponentMove:
      type: object
      required: [operation_id, type, target, arguments]
      properties:
        operation_id: {type: string, format: uuid}
        type: {type: string, const: component.move}
        target:
          type: object
          required: [page_key, node_id]
          properties:
            page_key: {type: string, minLength: 1}
            node_id: {type: string, minLength: 1}
          additionalProperties: false
        arguments:
          type: object
          required: [parent_node_id, slot]
          properties:
            parent_node_id: {type: string, minLength: 1}
            slot: {type: string, minLength: 1}
          additionalProperties: false
      additionalProperties: false
    ComponentSetProps:
      type: object
      required: [operation_id, type, target, arguments]
      properties:
        operation_id: {type: string, format: uuid}
        type: {type: string, const: component.set_props}
        target:
          type: object
          required: [page_key, node_id]
          properties:
            page_key: {type: string, minLength: 1}
            node_id: {type: string, minLength: 1}
          additionalProperties: false
        arguments:
          type: object
          required: [props]
          properties:
            props: {type: object}
          additionalProperties: false
      additionalProperties: false
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid: {type: boolean}
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
    PublishedRelease:
      type: object
      required: [id, site_id, release_no]
      properties:
