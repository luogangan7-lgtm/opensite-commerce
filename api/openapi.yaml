  /api/v1/t/{tenant_id}/quotes/{quote_id}/orders:
    post:
      tags: [Quotes]
      operationId: createQuoteOrder
      x-opensite-status: implemented
      x-opensite-access: BuyerCompany
      x-required-scope: quotes:convert
      x-opensite-trusted-buyer: required
      security:
        - customerSession: []
      description: >-
        Convert an approved quote to exactly one order from its immutable payable snapshot.
        The router's injected buyer authenticator must verify the separate customer session,
        exact storefront Origin, session-bound CSRF and active company membership;
        without it this endpoint returns 401. Tenant/company mismatch returns 404. Identity,
        amount, price, currency and snapshot fields are never accepted from the client.
        Requires one visible ASCII Idempotency-Key of 1 to 128 bytes, without whitespace.
        Retrying the same key returns the original conversion; competing different keys
        return 409, and reusing a key for a different quote returns 422. Conversion does not
