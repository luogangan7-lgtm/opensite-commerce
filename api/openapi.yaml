components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: __Host-osc_customer_session
      description: Tenant customer session only; Secure, HttpOnly, SameSite=Lax, Path=/, no Domain.
    StorefrontSession:
      type: apiKey
      in: cookie
      name: __Host-osc_customer_session
      description: Reserved for trusted customer middleware; C-18a does not implement it.
    GuestCapability:
      type: apiKey
      in: cookie
      name: __Host-osc_guest_capability
      description: Reserved for a verified opaque guest capability; never an admin cookie.
    FakeWebhookSignature:
      type: apiKey
      in: header
      name: X-Fake-Signature
      description: HMAC SHA256 of timestamp + dot + exact request bytes with isolated account key; DB-clock freshness; test/development only.
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-osc_admin_session
      description: >-
        Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain on a dedicated admin host. Unsafe cookie-authenticated
        requests require exact Origin and a session-bound HMAC X-CSRF-Token; API-key bearer requests do not require
        CSRF.
    CartToken:
      type: apiKey
      in: header
      name: X-Cart-Token
      description: 256-bit base64url guest cart capability. Trusted customer resolution is an optional server-only seam.
    ApiKeyBearer: {type: http, scheme: bearer, bearerFormat: API-Key}
  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant-scoped notification redrive key; the same notification and key replay the stored receipt.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    CartId:
      name: cart_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkuId:
      name: sku_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
        minLength: 43
        maxLength: 43
    LoginChallengeCookie:
      name: __Host-osc_login_csrf
      in: cookie
      required: true
      schema:
        type: string
        minLength: 1
      description: Signed anonymous login challenge with five-minute expiry; Secure
        HttpOnly SameSite=Lax Path=/ and no Domain.
    CheckoutOrigin:
      name: Origin
      in: header
      required: true
      description: Exact configured storefront origin; never the admin origin.
      schema: {type: string, format: uri}
    CheckoutCSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Verified by the trusted resolver against the customer session or guest capability.
      schema: {type: string, minLength: 1, maxLength: 512}
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: Target tenant UUID from the URL; credentials still require matching membership and scope. An
        API key must belong to this exact tenant.
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      description: Session owned by the caller; never a token.
      schema:
        type: string
        format: uuid
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the dedicated admin origin; login also requires the anonymous pre-login CSRF
        token.
      schema:
        type: string
        format: uri
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Signed HMAC bound to the current session, or short-lived anonymous material before login. Unsigned
        double-submit is not accepted.
      schema:
        type: string
        minLength: 1
    OriginIfCookie:
      name: Origin
      in: header
      required: false
      description: Required and checked for exact admin origin when authenticating with adminSession. API-key bearer
        requests are exempt from the cookie CSRF/Origin checks.
      schema:
        type: string
        format: uri
    CSRFTokenIfCookie:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required session-bound HMAC CSRF token when authenticating with adminSession; not required for
        API-key bearer calls.
      schema:
        type: string
        minLength: 1
    SiteId:
      name: site_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DraftId:
      name: draft_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Scoped per (actor, operation, key) with a stored request hash (007_reliability). The hash covers the canonical
        request: method, path template, resolved path parameters (e.g. upload_id, draft_id), canonicalized query
        and the body (empty body hashes as empty), so one key reused across different resources is a different request.
        Same key + same request after completion replays the original response; same key while the original request
        is still in progress returns 409 (Problem code `idempotency_in_progress`); same key + different request
        (path, query or body) returns 422 (Problem code `idempotency_key_reused`). Every operation taking this header
        declares 409 and 422.
      schema: {type: string, minLength: 1, maxLength: 128}
    VariantId:
      name: variant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: media_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque base64url created_at/id cursor from the prior response.
      schema:
        type: string
        maxLength: 512
    QuoteId:
      name: quote_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReturnId:
      name: return_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: BadRequest
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: NotFound
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: InternalServerError
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: ServiceUnavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication missing or invalid; bad login credentials are indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Origin, CSRF, tenant membership, API-key tenant binding or required scope denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict, including idempotency_in_progress.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match precondition failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the admission limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Unsupported request media type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validation failure or idempotency_key_reused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required precondition such as If-Match is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: RFC 9457 error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Redacted internal failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CustomerRegistrationInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          description: >-
            Length is 12 to 1024 UTF-8 bytes after JSON decoding, not a Unicode
            character count. No Unicode normalization is applied. NUL, CR and LF
            are rejected.
          x-opensite-min-utf8-bytes: 12
          x-opensite-max-utf8-bytes: 1024
    CustomerCredentialsInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password:
          type: string
          description: >-
            Length is 1 to 1024 UTF-8 bytes after JSON decoding, not a Unicode
            character count. No Unicode normalization is applied. NUL, CR and LF
            are rejected.
          x-opensite-min-utf8-bytes: 1
          x-opensite-max-utf8-bytes: 1024
    CustomerTokenInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    CustomerResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320}
    CustomerResetConfirm:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        password:
          type: string
          description: >-
            Length is 12 to 1024 UTF-8 bytes after JSON decoding, not a Unicode
            character count. No Unicode normalization is applied. NUL, CR and LF
            are rejected.
          x-opensite-min-utf8-bytes: 12
          x-opensite-max-utf8-bytes: 1024
    CustomerRegistrationReceipt:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [verification_pending]}
    CustomerResetReceipt:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [accepted]}
    CustomerSessionView:
      type: object
      additionalProperties: false
      required: [session_id, tenant_id, customer_id, email, expires_at, idle_expires_at]
      properties:
        session_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        email: {type: string, format: email}
        expires_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
    CustomerSessionEnvelope:
      type: object
      additionalProperties: false
      required: [customer, csrf_token]
      properties:
        customer:
          anyOf:
            - $ref: '#/components/schemas/CustomerSessionView'
            - {type: 'null'}
        csrf_token: {type: string}
    CheckoutStart:
      type: object
      additionalProperties: false
      required: [cart_id, shipping_address]
      properties:
        cart_id: {type: string, format: uuid}
        quote_id: {type: string, format: uuid, description: Unsupported in C-18a; returns 422.}
        buyer_contact:
          description: Guest snapshot only; required for a guest actor and forbidden for a customer actor.
          type: object
          additionalProperties: false
          required: [email]
          properties:
            email: {type: string, maxLength: 320, minLength: 3}
            name: {type: string, maxLength: 200}
            phone: {type: string, maxLength: 64}
        shipping_address:
          $ref: '#/components/schemas/CheckoutShippingAddress'
    CheckoutShippingAddress:
      type: object
      additionalProperties: false
      required: [country, address1, city, postal_code]
      properties:
        country: {type: string, pattern: '^[A-Z]{2}$'}
        subdivision: {type: string, maxLength: 100}
        address1: {type: string, minLength: 1, maxLength: 500}
        address2: {type: string, maxLength: 500}
        city: {type: string, minLength: 1, maxLength: 200}
        postal_code: {type: string, minLength: 1, maxLength: 32}
    CheckoutResult:
      type: object
      additionalProperties: false
      required: [checkout_id, order_id, state, amount_minor, currency, order_version, payment]
      properties:
        checkout_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        state: {type: string}
        amount_minor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        order_version: {type: integer, format: int64, minimum: 1}
        payment:
          type: object
          additionalProperties: false
          required: [provider_ref, status]
          properties:
            provider_ref: {type: string}
            status: {type: string}
            next_action_kind: {type: string}
            next_action_url: {type: string}
    FakePaymentEvent:
      type: object
      additionalProperties: false
      required: [event_id, account_id, order_id, order_version, provider_ref, status, amount_minor, currency]
      properties:
        event_id: {type: string, minLength: 1, maxLength: 128}
        account_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        order_id: {type: string, format: uuid}
        order_version: {type: integer, format: int64, minimum: 1}
        provider_ref: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [captured, failed, canceled, partially_refunded, refunded]}
        amount_minor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    FakePaymentReceipt:
      type: object
      additionalProperties: false
      required: [event_id, status]
      properties:
        event_id: {type: string, minLength: 1, maxLength: 128}
        status: {type: string, enum: [pending, processed, rejected]}
    NotificationFailure:
      type: object
      additionalProperties: false
      required: [id, event_id, template_key, status, attempts, generation, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        template_key: {type: string, enum: [order.paid, order.shipped, order.refund, quote.sent, quote.approved, quote.converted]}
        status: {type: string, enum: [failed, dead_letter, uncertain]}
        attempts: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
        generation: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        safe_error: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Z0-9_]+$'}
    NotificationFailures:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/NotificationFailure'}
    NotificationRedriveReceipt:
      type: object
      additionalProperties: false
      required: [notification_id, token, status, generation]
      properties:
        notification_id: {type: string, format: uuid}
        token: {type: string, format: uuid}
        status: {type: string, enum: [pending]}
        generation: {type: integer, format: int32, minimum: 2, maximum: 2147483647}
    CreateCart:
      type: object
      additionalProperties: false
      required:
      - currency
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          minLength: 3
          maxLength: 3
    SetCartLine:
      type: object
      additionalProperties: false
      required:
      - quantity
      properties:
        quantity:
          description: Absolute quantity; zero deletes the line.
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
    CartLine:
      type: object
      additionalProperties: false
      # A line carries either a complete quote or pricing_error, never both or neither.
      if: {required: [pricing_error]}
      then:
        not:
          anyOf:
          - required: [unit_amount]
          - required: [line_amount]
          - required: [price_list_id]
          - required: [priority]
          - required: [min_quantity]
      else: {required: [unit_amount, line_amount, price_list_id, priority, min_quantity]}
      required:
      - sku_id
      - quantity
      - available_quantity
      - sellable
      properties:
        sku_id: &id001
          type: string
          format: uuid
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        unit_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        line_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        price_list_id: *id001
        priority:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
        min_quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        available_quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        sellable:
          type: boolean
        pricing_error:
          type: string
          enum: [price_unavailable, amount_overflow]
          description: Quote is unavailable; monetary and selected price fields are omitted.
    Cart:
      type: object
      additionalProperties: false
      # A cart is either fully priced (subtotal) or not (pricing_error), never both or neither.
      if: {required: [pricing_error]}
      then: {not: {required: [subtotal]}}
      else: {required: [subtotal]}
      required:
      - id
      - currency
      - version
      - lines
      properties:
        id: *id001
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        lines:
          type: array
          maxItems: 1000
          description: At most 1000 distinct SKUs, so the representation fits the 1 MiB response buffer.
          items:
            $ref: '#/components/schemas/CartLine'
        subtotal:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        pricing_error:
          type: string
          enum: [price_unavailable, amount_overflow]
          description: Cart is not fully priced; subtotal is omitted.
    CreatedCart:
      type: object
      additionalProperties: false
      required:
      - cart
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        cart_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
    PublishedBlock:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: {type: string, enum: [heading, paragraph]}
        text: {type: string, minLength: 1, maxLength: 10000}
    PublishedNavigation:
      type: object
      additionalProperties: false
      required: [label, href]
      properties:
        label: {type: string, minLength: 1, maxLength: 200}
        href: {type: string, pattern: '^/(?:[a-zA-Z0-9_-]+(?:/[a-zA-Z0-9_-]+)*)?$', maxLength: 512}
    PublishedPage:
      type: object
      additionalProperties: false
      required: [path, title, description, blocks]
      properties:
        path:
          type: string
          description: Root-relative CMS path, including nested pages; product and error routes are reserved.
          pattern: '^/(?:[a-zA-Z0-9_-]+(?:/[a-zA-Z0-9_-]+)*)?$'
          maxLength: 512
          not:
            anyOf:
              - enum: ['/404', '/502', '/products']
              - pattern: '^/products/'
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 2000}
        blocks:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/PublishedBlock'}
    PublishedProduct:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, unit_amount, currency]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        slug: {type: string, pattern: '^[a-zA-Z0-9_-]+$', maxLength: 502}
        name: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 10000}
        unit_amount: {type: string, pattern: '^(0|[1-9][0-9]{0,37})$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    PublishedSite:
      type: object
      additionalProperties: false
      required: [tenant_id, site_id, release_id, locale, title, description, navigation, pages, products]
      properties:
        tenant_id:
          type: string
          description: Tenant resolved from the verified hostname; storefronts use it for tenant-scoped APIs such as /api/v1/t/{tenant_id}/carts.
        site_id: {type: string}
        release_id: {type: string}
        locale: {type: string}
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 2000}
        navigation:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PublishedNavigation'}
        pages:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PublishedPage'}
        products:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/PublicProduct'}
    SitePreview:
      description: CMS draft preview projection (never the public storefront body; no tenant_id or SKUs).
