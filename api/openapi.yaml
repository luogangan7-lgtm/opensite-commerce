  /api/v1/t/{tenant_id}/checkout:
    post:
      tags: [Checkout]
      operationId: createCheckout
      x-opensite-status: implemented
      x-opensite-access: Storefront
      description: >-
        C-18a trusted storefront resolver seam. Guest capability or customer session must be verified
        independently of URL and Host, with exact Origin and session-bound CSRF. This increment has no
        production resolver; missing resolver rejects. Storefront access carries no employee scope and
        never falls back to staff authentication. Prices, buyer identity and tenant authorization are not input.
        quote_id is rejected in this increment; B2B conversion is deferred.
      security:
        - StorefrontSession: []
        - GuestCapability: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CheckoutOrigin'
        - $ref: '#/components/parameters/CheckoutCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutStart'}
      responses:
        '201':
          description: Stable checkout and provider-neutral payment intent; replay returns the same IDs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/testing/payments/fake/webhook:
    post:
      tags: [Checkout]
      operationId: receiveFakePaymentEvent
      x-opensite-status: implemented
      x-opensite-access: Public
      x-test-only: true
      description: >-
        Explicit test/development configuration only; never mounted in production. Payments authenticates
        timestamp plus exact raw bytes and derives tenant authority from a trusted account binding.
        The durable receipt reports pending or processed; external facts never reissue provider commands.
      security:
        - FakeWebhookSignature: []
      parameters:
        - name: X-Fake-Signature
          in: header
          required: true
          schema: {type: string, pattern: '^t=[0-9]{1,12},v1=[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FakePaymentEvent'}
      responses:
        '200':
          description: Durable payment fact receipt after admission or replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FakePaymentReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/public/sites/current:
    get:
      tags: [Builder]
      operationId: getPublishedSite
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: >-
        Current public storefront body for a verified DNS hostname, served as the precomputed
        storefront serving row (docs/architecture/ADR_STOREFRONT_SERVING.md). Product content and
        SKU membership (sku_id, sku_code, option_values) are sealed at publish. price_minor is the
        anonymous default price (quantity 1, the product's release currency, active audience=all lists
        in their time window, priority descending then list id ascending) computed when the serving row
        was built; available is on-hand minus reserved > 0 at build time, never a count. Unpriced or
        non-ready SKUs at publish are not members (adding them requires republish). Price, stock and
        lifecycle changes invalidate the body in their own transaction and a refresher rebuilds it; a body
        past its next price boundary, 15-minute lifetime or 30-second invalidation grace is replaced by the
        fallback (skus []), never served stale. Products carry no product-level price: display prices come
        from skus. Cart and checkout re-price and reserve authoritatively. The body is host-independent
        (no hostname) and carries the host's tenant_id for tenant-scoped cart APIs.
      parameters:
        - name: host
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 254}
      responses:
        '200':
          description: Validated immutable public snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedSite'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: Published read unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /api/v1/auth/login:
    get:
      tags:
        - Identity
      operationId: getAdminLoginChallenge
      security: []
      description: Issues short-lived signed anonymous CSRF material in a Secure HttpOnly
        host-only cookie and returns the matching header token. No tenant context.
      responses:
        '200':
          description: Anonymous login challenge; Cache-Control no-store
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        '503':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-opensite-status: implemented
      x-opensite-access: Public
    post:
      tags:
        - Identity
      operationId: createStaffLoginSession
      security: []
      description: Requires the signed anonymous challenge cookie and matching X-CSRF-Token,
        plus the exact configured Origin. Always creates a fresh opaque session; rotation
        consumes a valid same-user old session atomically. Credentials and raw tokens
        are never included in problem details.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
