openapi: 3.1.2
info:
  title: OpenSite Commerce Core API
  version: 0.7.0-draft
  description: >-
    Contract-first first-vertical-slice API. Declared operations are not all implemented in this increment. Tenant
    business targets come from the URL path; credentials authorize them. Health, catalog, media, cart, notifications and
    published-site read operations are implemented; other operations are planned contracts.
servers:
  - url: /
security:
  - adminSession: []
  - ApiKeyBearer: []
tags:
  - name: Organization
  - name: Catalog
  - name: Media
  - name: Builder
  - name: Inquiry
  - name: Identity
  - name: Health
  - name: Quotes
  - name: Notifications
paths:
  /api/v1/t/{tenant_id}/customer/registrations:
    post:
      operationId: registerCustomer
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationInput'
      responses:
        '202':
          description: Customer authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRegistrationReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/t/{tenant_id}/customer/verifications:
    post:
      operationId: verifyCustomerEmail
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerTokenInput'
      responses:
        '204':
          description: Customer authentication result
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/t/{tenant_id}/customer/session:
    get:
      operationId: getCustomerSession
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Customer authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createCustomerSession
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCredentialsInput'
      responses:
        '200':
          description: Customer authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteCustomerSession
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, maxLength: 512}
      responses:
        '204':
          description: Customer authentication result
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/t/{tenant_id}/customer/password-resets:
    post:
      operationId: requestCustomerPasswordReset
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerResetRequest'
      responses:
        '202':
          description: Customer authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResetReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/t/{tenant_id}/customer/password-resets/confirm:
    post:
      operationId: confirmCustomerPasswordReset
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerResetConfirm'
      responses:
        '204':
          description: Customer authentication result
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/public/sites/current:
    get:
      tags: [Builder]
      operationId: getPublishedSite
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Current sealed public release for a verified DNS hostname. Version-1 public manifest seals product view models derived from catalog published listings and pinned content revisions.
      parameters:
        - name: host
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 254}
      responses:
        '200':
          description: Validated immutable public snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishedSite'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: Published read unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /healthz:
    get:
      tags: [Health]
      operationId: health
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      responses:
        '204': {description: Process is healthy}
  /api/v1/auth/admin-sessions:
    post:
      tags:
        - Identity
      operationId: createAdminSession
      x-opensite-status: planned
      x-opensite-access: Public
      security: []
      description: Login uses exact Origin plus short-lived anonymous pre-login CSRF material. Bad credentials,
        disabled and unknown users have the same 401 response and work. Implemented by PR-02.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminSession'
      responses:
        '201':
          description: New server-side session; never returns the session bearer token in JSON.
          headers:
            Set-Cookie:
              description: __Host-osc_admin_session; Secure; HttpOnly; SameSite=Lax; Path=/; no Domain. Issued only
                on the dedicated admin host.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Identity
      operationId: listAdminSessions
      x-opensite-status: planned
      x-opensite-access: AuthenticatedSelf
      security:
        - adminSession: []
      description: List only the active caller own sessions. Requires a valid session and active user, even when
        no tenant membership remains.
      responses:
        '200':
          description: Caller sessions; no tokens or hashes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/admin-sessions/current:
    delete:
      tags:
        - Identity
      operationId: deleteAdminSession
      x-opensite-status: planned
      x-opensite-access: AuthenticatedSelf
      security:
        - adminSession: []
      description: Revoke the current session and clear its cookie. No membership or scope required. Exact Origin
        and session-bound HMAC CSRF token required.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Current session revoked.
          headers:
            Set-Cookie:
              description: Clears __Host-osc_admin_session with Max-Age=0, Secure, HttpOnly, SameSite=Lax, Path=/
                and no Domain.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/admin-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags:
        - Identity
      operationId: revokeAdminSession
      x-opensite-status: planned
      x-opensite-access: AuthenticatedSelf
      security:
        - adminSession: []
      description: Revoke only a session owned by the caller. Exact Origin and session-bound HMAC CSRF token required.
        No tenant membership or scope required.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Owned session revoked.
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/current-actor:
    get:
      tags:
        - Identity
      operationId: getCurrentActor
      x-opensite-status: planned
      x-opensite-access: AuthenticatedSelf
      security:
        - adminSession: []
      description: The active caller identity only; no tenant membership or tenant authorization is inferred.
      responses:
        '200':
          description: Current active user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/t/{tenant_id}/organizations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Organization]
      operationId: createOrganization
      x-opensite-status: planned
      x-opensite-access: AdminOrAPIKey
      x-required-scope: organization.create
      description: >-
        Create a seller organization within the target tenant, with membership and organization.create scope. This
        does not create a tenant or owner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginIfCookie'
        - $ref: '#/components/parameters/CSRFTokenIfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrganization'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/t/{tenant_id}/sites:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Organization]
      operationId: createSite
      x-opensite-status: planned
      x-opensite-access: AdminOrAPIKey
      x-required-scope: site.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginIfCookie'
        - $ref: '#/components/parameters/CSRFTokenIfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSite'}
      responses:
        '201':
          description: Site created, initially unpublished
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Site'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/t/{tenant_id}/products:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags:
        - Catalog
      operationId: createProduct
      x-opensite-status: implemented
      x-opensite-access: AdminOrAPIKey
      x-required-scope: catalog:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginIfCookie'
        - $ref: '#/components/parameters/CSRFTokenIfCookie'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
    get:
      tags:
        - Catalog
      operationId: listProducts
      x-opensite-status: implemented
      x-opensite-access: AdminOrAPIKey
      x-required-scope: catalog:read
      responses:
