      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UploadId'
    post:
      tags:
        - Media
      operationId: completeMediaUpload
      x-opensite-status: implemented
      x-opensite-access: AdminOrAPIKey
      x-required-scope: media:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginIfCookie'
        - $ref: '#/components/parameters/CSRFTokenIfCookie'
      responses:
        '202':
          description: Content verified and private media persisted synchronously; no asynchronous transform in this
            card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/t/{tenant_id}/sites/{site_id}/drafts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SiteId'
    post:
      tags: [Builder]
      operationId: createSiteDraft
      x-opensite-status: planned
      x-opensite-access: AdminOrAPIKey
      x-required-scope: site.draft.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OriginIfCookie'
        - $ref: '#/components/parameters/CSRFTokenIfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDraft'}
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/t/{tenant_id}/sites/{site_id}/drafts/{draft_id}/operations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [Builder]
      operationId: applyPageOperations
      x-opensite-status: planned
      x-opensite-access: AdminOrAPIKey
      x-required-scope: site.draft.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/OriginIfCookie'
        - $ref: '#/components/parameters/CSRFTokenIfCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationBatch'}
      responses:
        '200':
          description: Draft revision incremented
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/t/{tenant_id}/sites/{site_id}/drafts/{draft_id}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [Builder]
      operationId: validateSiteDraft
      x-opensite-status: planned
      x-opensite-access: AdminOrAPIKey
      x-required-scope: site.draft.write
      parameters:
        - $ref: '#/components/parameters/OriginIfCookie'
        - $ref: '#/components/parameters/CSRFTokenIfCookie'
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
