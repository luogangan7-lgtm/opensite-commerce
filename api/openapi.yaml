      properties:
        operation_id: {type: string, format: uuid}
        type: {type: string, const: component.set_props}
        target:
          type: object
          required: [page_key, node_id]
          properties:
            page_key: {type: string, minLength: 1}
            node_id: {type: string, minLength: 1}
          additionalProperties: false
        arguments:
          type: object
          required: [props]
          properties:
            props: {type: object}
          additionalProperties: false
      additionalProperties: false
