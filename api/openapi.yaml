        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        lifecycle_status:
          type: string
          enum:
          - draft
          - ready
          - archived
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        option_value_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
    CreateUpload:
