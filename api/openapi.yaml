      additionalProperties: false
      required: [site_id, release_id, hostname, locale, title, description, navigation, pages, products]
      properties:
        site_id: {type: string}
        release_id: {type: string}
        hostname: {type: string}
        locale: {type: string}
        title: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 2000}
        navigation:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PublishedNavigation'}
        pages:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PublishedPage'}
        products:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/PublishedProduct'}
    PublicProduct:
      type: object
      additionalProperties: false
      description: Public product view. No product-level price; display prices come from the purchasable skus.
      required: [id, slug, name, description, skus]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        slug: {type: string, pattern: '^[a-zA-Z0-9_-]+$', maxLength: 502}
        name: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 10000}
        skus:
          type: array
          maxItems: 100
          description: Purchasable SKUs; see getPublishedSite for membership, price and availability rules.
          items: {$ref: '#/components/schemas/PublishedSku'}
    PublishedSkuOptionValue:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        value: {type: string, maxLength: 255}
    PublishedSku:
      type: object
      additionalProperties: false
      required: [sku_id, sku_code, option_values, price_minor, currency, available]
      properties:
        sku_id: {type: string, minLength: 1, maxLength: 128}
        sku_code: {type: string, minLength: 1, maxLength: 255}
        option_values:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/PublishedSkuOptionValue'}
        price_minor:
          type: string
          description: Anonymous default unit price in minor units as a decimal string, as of the serving build.
          pattern: '^(0|[1-9][0-9]{0,18})$'
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        available:
          type: boolean
          description: True when on-hand stock exceeded active reservations at the serving build; never a count.
