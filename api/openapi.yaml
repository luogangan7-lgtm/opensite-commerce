openapi: 3.1.2
info:
  title: OpenSite Commerce Core API
  version: 0.7.0-draft
  description: >-
    Contract-first first-vertical-slice API. Declared operations are not all implemented in this increment. Tenant
    business targets come from the URL path; credentials authorize them. Health, catalog, media, cart, notifications,
    published-site read, staff login and tenant API key management operations are implemented; other operations are planned contracts. Checkout composition is opt-in;
    its trusted storefront resolver is deferred and Fake callback transport is restricted to explicit test/development mode.
servers:
  - url: /
security:
  - adminSession: []
  - ApiKeyBearer: []
tags:
  - name: Checkout
  - name: Organization
  - name: Catalog
  - name: Media
  - name: Builder
  - name: Inquiry
  - name: Identity
  - name: Health
  - name: Quotes
  - name: Notifications
  - name: Orders
  - name: Fulfillment
  - name: Returns
paths:
  /api/v1/t/{tenant_id}/api-keys:
    post:
      tags: [Identity]
      operationId: createAPIKey
      x-opensite-status: implemented
      x-opensite-access: AdminSession
      x-required-scope: apikeys:write
      description: >-
        An active owner or admin creates a key for this tenant with scopes no wider than their current role.
        The 256-bit secret is returned once. No Idempotency-Key replay is provided because plaintext
        secrets must never be retained to reproduce a response. A lost response requires revocation and a new key.
        Unknown scopes are rejected; tenant, issuer and hash are server-derived.
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAPIKey'}
      responses:
        '201':
          description: New key with its one-time plaintext credential; never cache this response.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKeyCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      tags: [Identity]
      operationId: listAPIKeys
      x-opensite-status: implemented
      x-opensite-access: AdminSession
      x-required-scope: apikeys:write
      description: Lists the newest 100 keys owned by this tenant, including revoked keys, ordered by creation time then ID; plaintext and hashes are never returned. Older keys can still be revoked by ID.
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Key metadata only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKeyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/t/{tenant_id}/api-keys/{key_id}:
    delete:
      tags: [Identity]
      operationId: revokeAPIKey
      x-opensite-status: implemented
      x-opensite-access: AdminSession
      x-required-scope: apikeys:write
      description: >-
        Revokes a key owned by this tenant. Repeating revocation of an existing key succeeds;
        a missing or cross-tenant key returns 404. Revocation is effective on the next authorization check.
      security: [{adminSession: []}]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: key_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': {description: Key revoked; no response body.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '500': {$ref: '#/components/responses/InternalServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/t/{tenant_id}/customer/registrations:
    post:
      operationId: registerCustomer
      x-opensite-status: implemented
      x-opensite-access: Public
      security: []
      description: Tenant customer authentication only. Staff cookies and keys never authenticate customers. GET session returns a signed anonymous challenge before login; writes require exact pinned Origin and signed anonymous or session CSRF. Only Fake or local test mail is enabled.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationInput'
      responses:
        '202':
          description: Customer authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRegistrationReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
