name: checkout-consent-regressions
on: pull_request

# Independent money witnesses reach their assertions even when a preceding
# required source gate is RED. Required foundation/frontend gates stay intact.
jobs:
  consent-pg:
    if: startsWith(github.head_ref, 'codex/c09e-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      OPENSITE_REQUIRE_PGX_FIXTURES: '1'
      DATABASE_URL: postgres://postgres:ci_test_only@localhost:5432/opensite?sslmode=disable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Disposable PostgreSQL migrations
        run: |
          go mod download
          python3 scripts/pending_migrations.py ci-normalize
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          bash scripts/migrate_river.sh
          bash scripts/migrate.sh
      - name: Accepted money and replay regressions
        run: go test -race -tags pgx -count=1 -v -run 'TestCheckoutPG.*Consent|TestCheckoutPGConsentReplayAndRepricing' ./internal/db

  consent-browser:
    if: startsWith(github.head_ref, 'codex/c09e-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://postgres:ci_test_only@postgres:5432/opensite?sslmode=disable
      OPENSITE_ENVIRONMENT: test
      OSC_COMMERCE_TEST_HTTP: '1'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip postgresql-client
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: go mod download
      - run: bun install --frozen-lockfile
      - name: BFF accepted money regressions
        run: bun test web/storefront/src/lib/commerce-payment.test.ts
      - name: Build storefront for independent browser witness
        if: success() || failure()
        run: bun run build:storefront
      - name: Explicit changed-total browser consent
        if: success() || failure()
        run: bun run visual:test tests/frontend/storefront-commerce.spec.ts --grep 'checkout requires confirmation|stale Start' --project desktop
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: consent-browser-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 7
