name: local-ops-drill
on:
  workflow_dispatch:

# A full image build and destructive disposable-volume rehearsal runs on demand.
# Fast ops safety tests still run in the required foundation check_all gate.
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Rehearse only a randomly named disposable Compose project
        run: bash scripts/ops_drill.sh --receipt-dir work/C23a/ci
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ops-drill-${{ github.sha }}-${{ github.run_id }}
          path: work/C23a/ci
          retention-days: 7
