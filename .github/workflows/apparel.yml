name: apparel
on:
  pull_request:
    paths: ['web/apparel/**', 'packages/design-tokens/**', 'bun.lock', '.github/workflows/apparel.yml']
  push:
    branches: [feat/apparel-b2b-v1]
permissions:
  contents: read
jobs:
  generated:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[apparel-generate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
      - run: bun install --ignore-scripts
      - run: bun packages/design-tokens/generate.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: apparel-generated
          path: |
            bun.lock
            packages/design-tokens/src/tokens.css
            packages/design-tokens/src/tokens.ts
          if-no-files-found: error
  apparel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: tokens:check
        run: bun packages/design-tokens/generate.ts --check
      - name: RFQ validation
        run: bun test web/apparel/tests/rfq.test.ts
      - name: Typecheck
        run: bun run --cwd web/apparel check
      - name: Static build
        run: bun run --cwd web/apparel build
      - name: Package Pages Function in CI
        run: cd web/apparel && bunx wrangler@4.156.0 pages functions build functions --outfile dist/_worker.js
      - name: Distribution gates
        run: |
          bun web/apparel/tests/dist-gate.ts
          bun web/apparel/tests/probes.ts
      - run: bunx playwright install --with-deps chromium
      - name: Playwright 390px
        run: bunx playwright test --config web/apparel/playwright.config.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: apparel-evidence
          path: evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: apparel-dist
          path: web/apparel/dist/
          if-no-files-found: error
