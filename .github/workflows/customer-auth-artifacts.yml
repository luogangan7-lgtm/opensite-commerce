# CI-owned generators: local machines only write/download source artifacts.
name: customer-auth-generated-artifacts
on: [push]
permissions:
  contents: read
jobs:
  generate:
    if: contains(github.event.head_commit.message, '[customer-auth-codegen]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - name: Generate pinned server and client contracts
        run: |
          go mod tidy
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          bun install --frozen-lockfile
          bun packages/api-client/node_modules/openapi-typescript/bin/cli.js api/openapi.yaml -o packages/api-client/src/schema.d.ts
      - name: Install verified sqlc and generate database bindings
        run: |
          curl -fsSL --retry 3 https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir /tmp/customer-sqlc
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/customer-sqlc
          /tmp/customer-sqlc/sqlc generate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: customer-auth-generated-${{ github.sha }}
          path: |
            internal/db
            internal/platform/httpapi/generated/api.gen.go
            packages/api-client/src/schema.d.ts
            go.mod
            go.sum
          retention-days: 7
