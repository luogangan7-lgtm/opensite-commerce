# Temporary probe209 only: identical fixture and original gate on control/mutant.
name: h4b-clock-mutation
on: [pull_request]
permissions:
  contents: read
jobs:
  clock-probe:
    if: github.head_ref == 'codex/h4b-clock-appclock-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [control, mutant]
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      JOBS_REQUIRE_PG: '1'
      DATABASE_URL: postgresql://postgres:ci_test_only@localhost:5432/opensite?sslmode=disable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ matrix.variant == 'control' && '33a4db87daf8c4bc3f20c9136e6ca83a8b81acab' || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind source
        run: git rev-parse HEAD
      - name: Normalize pending migrations only in ephemeral CI checkout
        run: python3 scripts/pending_migrations.py ci-normalize
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Fixture PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Original host-skew gate (must pass control and fail mutant)
        run: go test -v -race -tags pgx -count=1 -run '^TestH4ClockAdmissionPostgres$' ./internal/modules/identity
