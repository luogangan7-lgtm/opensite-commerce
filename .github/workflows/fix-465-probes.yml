name: fix-465-temporary-mutations
on: [pull_request]
permissions:
  contents: read
jobs:
  mutation:
    if: github.head_ref == 'codex/fix-465'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mutant: [strict-attempt, stale-fallback]
    env:
      MUTANT: ${{ matrix.mutant }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - name: Python tools (hash-locked)
        run: python -m pip install --quiet --require-hashes -r requirements-ci.txt
      - name: Green control
        run: |
          python3 -m unittest -v tests.test_batch_hygiene.RerunAttemptRule
          bun test scripts/frontend/rerun-attempts.test.ts
      - name: Inject the same fault in both languages
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          strict = os.environ['MUTANT'] == 'strict-attempt'
          changes = {
              'scripts/rerun_attempts.py': (
                  'executions[identity] = min(executions.get(identity, attempt), attempt)' if strict else 'latest = max(attempts)',
                  'executions[("attempt", attempt)] = attempt' if strict else 'latest = min(attempts)'),
              'scripts/frontend/rerun-attempts.ts': (
                  'const key = JSON.stringify(identity);' if strict else 'const latest = Math.max(...attempts);',
                  "const key = JSON.stringify(['attempt', attempt]);" if strict else 'const latest = Math.min(...attempts);'),
          }
          for file, (before, after) in changes.items():
              path = Path(file)
              text = path.read_text()
              assert text.count(before) == 1, file
              path.write_text(text.replace(before, after))
          PYTHON
      - name: Require causal RED in both languages
        run: |
          set +e
          python3 -m unittest -v tests.test_batch_hygiene.RerunAttemptRule > "$RUNNER_TEMP/python.log" 2>&1
          python_status=$?
          bun test scripts/frontend/rerun-attempts.test.ts > "$RUNNER_TEMP/bun.log" 2>&1
          bun_status=$?
          set -e
          cat "$RUNNER_TEMP/python.log" "$RUNNER_TEMP/bun.log"
          test "$python_status" -ne 0
          test "$bun_status" -ne 0
          case "$MUTANT" in
            strict-attempt) vector=carried_over_success_with_new_id_and_attempt_uses_original_receipt ;;
            stale-fallback) vector=reexecuted_success_uses_own_receipt ;;
            *) exit 1 ;;
          esac
          grep -E "(ERROR|FAIL):.*case='$vector'" "$RUNNER_TEMP/python.log"
          grep -F "(fail) shared vectors: $vector" "$RUNNER_TEMP/bun.log"
          echo "PROBE RED: $MUTANT rejected in Python and TypeScript"
      - name: Restore and require GREEN
        run: |
          git restore -- scripts/rerun_attempts.py scripts/frontend/rerun-attempts.ts
          python3 -m unittest -v tests.test_batch_hygiene.RerunAttemptRule
          bun test scripts/frontend/rerun-attempts.test.ts
          echo "PROBE GREEN: restored implementations pass"
