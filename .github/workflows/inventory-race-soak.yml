name: inventory-race-soak
on:
  workflow_dispatch:
  push:
    branches: [ci/race-soak]

# Investigation only; this job is deliberately not a required PR context.
permissions:
  contents: read
jobs:
  inventory-race-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_soak_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://postgres:ci_soak_only@localhost:5432/opensite?sslmode=disable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Prepare disposable PostgreSQL fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          go mod download
          mkdir -p .work/inventory-race-soak
          bash scripts/check_pg.sh > .work/inventory-race-soak/fixture.log 2>&1
      - name: Deterministic real-PG readiness and startup-gap regressions
        shell: bash
        run: python3 tests/test_inventory_race_sync.py 2>&1 | tee .work/inventory-race-soak/regressions.log
      - name: Fifty independent trials of the actual inventory race gates
        run: python3 scripts/soak_inventory_races.py --trials 50 --output .work/inventory-race-soak
      - name: Preserve all trials, full failures and immutable source receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: inventory-race-soak-${{ github.run_id }}
          path: .work/inventory-race-soak
          if-no-files-found: error
          retention-days: 14
