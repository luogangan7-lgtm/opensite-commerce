# Responsibility: produce reproducible generated contract files for CI-only development.
# Dependencies: committed Go tools, Bun lock and verified sqlc release; caller: marked branch push.
# Invariant: artifacts precede the drift failure; no bot writes or required-check changes.
name: generated-contract-artifacts
on: [push]
permissions:
  contents: read
jobs:
  generated-contracts:
    if: contains(github.event.head_commit.message, '[contract-codegen]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: go mod download
      - run: bun install --frozen-lockfile
      - name: Generate from committed source and locked tools
        run: |
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          bun packages/api-client/node_modules/openapi-typescript/bin/cli.js api/openapi.yaml -o packages/api-client/src/schema.d.ts
          curl -fsSL --retry 3 https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/sqlc.tar.gz"
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  $RUNNER_TEMP/sqlc.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sqlc-bin"
          tar -xzf "$RUNNER_TEMP/sqlc.tar.gz" -C "$RUNNER_TEMP/sqlc-bin"
          "$RUNNER_TEMP/sqlc-bin/sqlc" generate
          git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: generated-contracts-${{ github.run_id }}
          path: |
            source-sha.txt
            internal/platform/httpapi/generated/api.gen.go
            packages/api-client/src/schema.d.ts
            internal/db
          if-no-files-found: error
          retention-days: 7
      - name: Report generated drift
        run: git diff --exit-code -- internal/platform/httpapi/generated/api.gen.go packages/api-client/src/schema.d.ts internal/db
