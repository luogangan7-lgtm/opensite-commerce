# Responsibility: temporary CI-only producer for reviewed C-02c generated artifacts.
# The ordinary drift gates remain authoritative; import exact artifact bytes only.
name: c02c-generate
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: Generate with pinned tools
        run: |
          curl -fsSL --retry 3 https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sqlc-bin
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/sqlc-bin
          /tmp/sqlc-bin/sqlc generate
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          (cd packages/api-client && bun run generate)
          mkdir -p work/C02c/generated
          git rev-parse HEAD > work/C02c/generated/source-sha.txt
          sha256sum sqlc.yaml api/openapi.yaml api/oapi-codegen.yaml migrations/*.sql queries/tenant/*.sql > work/C02c/generated/inputs.sha256
          git diff -- internal/db internal/platform/httpapi/generated/api.gen.go packages/api-client/src/schema.d.ts > work/C02c/generated/drift.patch
          sha256sum internal/db/*.go internal/platform/httpapi/generated/api.gen.go packages/api-client/src/schema.d.ts > work/C02c/generated/outputs.sha256
      - name: Require committed generation to match
        run: |
          git diff --exit-code -- internal/db internal/platform/httpapi/generated/api.gen.go packages/api-client/src/schema.d.ts
          test -z "$(git status --porcelain --untracked-files=all -- internal/db internal/platform/httpapi/generated/api.gen.go packages/api-client/src/schema.d.ts)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: c02c-generated-${{ github.run_id }}
          path: |
            work/C02c/generated
            internal/db/*.go
            internal/platform/httpapi/generated/api.gen.go
            packages/api-client/src/schema.d.ts
          retention-days: 7
