# Responsibility: disposable MDEL-00 mutation evidence; no application deployment.
# Dependencies: final round-6 source, migrated PG18 CHECKs and the SQL regression.
# Invariant: removing either storage CHECK must make the behavioral gate RED.
name: mdel00-constraint-probes
on:
  push:
    branches: [codex/mdel00-r6-probes]
permissions:
  contents: read
jobs:
  constraint-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        remove: [returns_refund_key_uuid, data_rights_erasures_scope_enum]
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://postgres:ci_test_only@localhost:5432/opensite?sslmode=disable
      REMOVE_CHECK: ${{ matrix.remove }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: 1.27.2
      - name: Record candidate parent and remove exactly one CHECK in CI
        run: |
          git log -2 --format='%H %s'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          path = Path('migrations/pending/mdel00-caller-keys_caller_key_constraints.sql')
          lines = path.read_text().splitlines(keepends=True)
          needle = ' ADD CONSTRAINT ' + os.environ['REMOVE_CHECK'] + ' CHECK '
          removed = [line for line in lines if needle in line]
          assert len(removed) == 1, 'mutation target must resolve exactly once'
          path.write_text(''.join(line for line in lines if needle not in line))
          print('MDEL00_MUTANT', os.environ['REMOVE_CHECK'], hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Apply the actual forward migration chain
        run: |
          ./scripts/ci_apt_install.sh postgresql-client
          python3 scripts/pending_migrations.py ci-normalize
          ./scripts/migrate_river.sh
          ./scripts/migrate.sh
      - name: Require behavioral gate to detect missing CHECK (expected RED)
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/db_caller_key_constraints.sql
