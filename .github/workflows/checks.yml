name: foundation-contracts
on: [push, pull_request]

# PR commits are validated by the pull_request run only; push runs of non-main
# branches exist only for explicitly requested artifact producer jobs.
concurrency:
  # main runs get unique groups so no queued main run is ever replaced.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One required foundation context aggregates parallel lanes without dropping gates.
jobs:
  # Optional CI-only generator handoff; required drift gates remain unchanged.
  codegen-handoff:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[codegen-artifact]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - name: Generate pinned source in CI
        env:
          GOTOOLCHAIN: local
        run: |
          go mod download
          bun install --frozen-lockfile
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          bun packages/api-client/node_modules/openapi-typescript/bin/cli.js api/openapi.yaml -o packages/api-client/src/schema.d.ts
          curl -fsSL --retry 3 https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sqlc-bin
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/sqlc-bin
          /tmp/sqlc-bin/sqlc generate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codegen-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            api/openapi.yaml
            sqlc.yaml
            internal/platform/httpapi/generated/api.gen.go
            internal/db/*.go
            packages/api-client/src/schema.d.ts
          if-no-files-found: error
          retention-days: 7

  foundation-lane:
    name: foundation-${{ matrix.lane }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 2026-10-23 measurement: max of last 10 successful main lane runs = 7.2 min (foundation-offline); 3x -> 22.
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        lane: [go, offline, pg, pgx, sqlc]
    # Default Go tests use real PG TEMP transactions too (also inside check_all).
    # Every lane therefore needs its own server; no lane shares mutable fixtures.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      JOBS_REQUIRE_PG: '1'
      IDEMPOTENCY_REQUIRE_PG: '1'
      OUTBOX_REQUIRE_PG: '1'
      OPENSITE_REQUIRE_PGX_FIXTURES: '1'
      CUSTOMER_AUTH_REQUIRE_PG: '1'
      DATABASE_URL: postgres://postgres:ci_test_only@localhost:5432/opensite?sslmode=disable
      C07_FIXTURE_PASSWORD: ci_catalog_test_only
      C07_DATABASE_URL: postgres://c07_runtime:ci_catalog_test_only@localhost:5432/opensite?sslmode=disable
      C07_MEDIA_DATABASE_URL: postgres://c07_media:ci_catalog_test_only@localhost:5432/opensite?sslmode=disable
      # Every pgx step (incl. check_codegen) needs the C-22a fixture; #54 forbids skips.
      C22A_DATABASE_URL: postgres://c07_runtime:ci_catalog_test_only@localhost:5432/opensite?sslmode=disable
      C22A_MAINTENANCE_DATABASE_URL: postgres://postgres:ci_test_only@localhost:5432/opensite?sslmode=disable
    steps:
      # Prerequisite lanes test the exact PR head, never the synthetic
      # pull_request merge commit: final landing acceptance binds to this SHA.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the exact checkout identity this lane tests
        env:
          LANE: ${{ matrix.lane }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          payload = {
              'lane': os.environ['LANE'],
              'event_sha': os.environ['EVENT_HEAD_SHA'],
              'checked_out_sha': head,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          with open(f"lane-{os.environ['LANE']}.json", 'w') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(payload, sort_keys=True))
          PYTHON
      - name: Land in-development migrations in this ephemeral checkout only
        run: python3 scripts/pending_migrations.py ci-normalize
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
          cache: false
      # Fresh final-measurement namespace; preserve earlier diagnostic caches/receipts.
      # Separate tag lanes; immutable checkout-key caches contain no DB or test fixtures.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ci-speed-1-r2-final-${{ runner.os }}-${{ runner.arch }}-go1.27.2-${{ matrix.lane }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-speed-1-r2-final-${{ runner.os }}-${{ runner.arch }}-go1.27.2-${{ matrix.lane }}-${{ hashFiles('go.sum') }}-
      - name: Download pinned Go modules
        run: go mod download
      - name: Prepare independent pgx and sqlc databases
        if: matrix.lane == 'pgx' || matrix.lane == 'sqlc'
        run: |
          ./scripts/ci_apt_install.sh postgresql-client
          ./scripts/migrate_river.sh
          ./scripts/migrate.sh
      - name: Go / PageGraph / LocalFS / Tenant Transaction
        if: matrix.lane == 'go'
        run: |
          go mod download
          # Guard slow runners; shared OAS loading removes repeated parse work.
          go test -race -count=1 -timeout=15m ./...
          go vet ./...
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.lane == 'offline'
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
        if: matrix.lane == 'offline'
      - name: Python tools (hash-locked)
        if: matrix.lane == 'offline' || matrix.lane == 'pg'
        run: python -m pip install --quiet --require-hashes -r requirements-ci.txt
      - name: All-migration Go and DB role-scope parity
        if: matrix.lane == 'pgx'
        run: |
          ./scripts/ci_apt_install.sh postgresql-client
          go test -tags pgx -count=1 -timeout=5m -v -run '^TestC02cRoleScopesMirrorPostgres$' ./internal/modules/identity
      - name: CI pin policy and offline gates
        if: matrix.lane == 'offline'
        run: |
          python3 scripts/check_ci_pins.py
          bash scripts/check_all.sh
      - name: OpenAPI structural checks
        if: matrix.lane == 'offline'
        run: |
          python scripts/check_contract.py
          openapi-spec-validator api/openapi.yaml
      - name: Pinned strict OpenAPI generation and drift gate
        if: matrix.lane == 'offline'
        run: |
          python3 scripts/check_oapi_codegen.py
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code -- internal/platform/httpapi/generated/api.gen.go
          test -z "$(git status --porcelain --untracked-files=all -- internal/platform/httpapi/generated/api.gen.go)"
      # CI-only development can retrieve the exact generator output after a
      # deliberate drift failure. The required drift gate still fails normally.
      - name: Generate requested OpenAPI handoff in CI
        id: requested_openapi
        if: matrix.lane == 'offline' && failure() && github.event_name == 'push' && contains(github.event.head_commit.message, '[codegen-artifact]')
        run: go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
      - name: Export requested OpenAPI generator output
        if: matrix.lane == 'offline' && failure() && steps.requested_openapi.conclusion == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openapi-codegen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            api/openapi.yaml
            internal/platform/httpapi/generated/api.gen.go
          if-no-files-found: error
          retention-days: 7
      - name: PostgreSQL 18 forward-only migrations and security
        if: matrix.lane == 'pg'
        run: |
          ./scripts/ci_apt_install.sh postgresql-client
          ./scripts/check_pg.sh
          python3 tests/test_inventory_race_sync.py
          ./scripts/check_pg_races.sh
          ./scripts/check_pg_upgrade.sh
      - name: Privacy column registry and persisted canary coverage
        if: matrix.lane == 'pg'
        run: python3 scripts/privacy_registry.py --database --fixture
      - name: Data-rights erasure over every registry canary
        if: matrix.lane == 'pg'
        run: python3 scripts/check_data_rights_canaries.py
      - name: Catalog/media real HTTP gates with isolated role logins
        if: matrix.lane == 'pgx' || matrix.lane == 'sqlc'
        env:
          OPENSITE_DISPOSABLE_PG: '1'
        run: ./scripts/check_catalog_api.sh
      - name: Go pgx-tagged vet and race tests
        if: matrix.lane == 'pgx' || matrix.lane == 'sqlc'
        run: |
          # Restore the committed isolated fixture after its HTTP mutation tests.
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f tests/fixtures/catalog_api.sql
          auth_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$auth_secret"
          export CUSTOMER_AUTH_FIXTURE_SECRET="$auth_secret"
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f tests/fixtures/customer_auth.sql
          export CUSTOMER_AUTH_TEST_DATABASE_URL="postgresql://c05b_customer:$auth_secret@localhost:5432/opensite?sslmode=disable"
          printf '%s\n' "CUSTOMER_AUTH_TEST_DATABASE_URL=$CUSTOMER_AUTH_TEST_DATABASE_URL" >> "$GITHUB_ENV"
      - name: Go pgx-tagged vet and race tests (all packages)
        if: matrix.lane == 'pgx'
        run: |
          go vet -tags pgx ./...
          # The full bootstrap suite exceeded Go's 10m package default on slow
          # runners (39779427428, attempts 1-2); keep it bounded within this 45m job.
          go test -race -tags pgx -count=1 -timeout=15m ./...
      - name: sqlc v1.31.1 (verified release artifact)
        if: matrix.lane == 'sqlc'
        run: |
          curl -fsSL --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sqlc-bin
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/sqlc-bin
          sudo install -m 0755 /tmp/sqlc-bin/sqlc /usr/local/bin/sqlc
          sqlc version
      - name: Typechecked pgx v5/sqlc integration and generated-code cleanliness
        if: matrix.lane == 'sqlc'
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f tests/fixtures/catalog_api.sql
          # Cached compilation must never reuse a successful test result.
          go clean -testcache
          ./scripts/check_codegen.sh
          # Generated code and module files must be committed, not regenerated differently per build.
          git diff --exit-code -- go.mod go.sum internal/db
          if [ -n "$(git status --porcelain --untracked-files=all -- internal/db)" ]; then
            echo "FAIL: internal/db differs from committed sqlc output"
            git status --short --untracked-files=all -- internal/db
            exit 1
          fi
      - name: Upload the tested checkout identity for landing acceptance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lane-identity-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: lane-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 7

  # Required branch-protection context: skipped/cancelled is never success.
  foundation:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [foundation-lane]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every foundation lane to succeed
        env:
          LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['LANE_RESULTS'])
          print(json.dumps(results, sort_keys=True))
          sys.exit(0 if results and all(x.get('result') == 'success' for x in results.values()) else 1)
          PYTHON
      # Proposal validation and final landing are different decisions. The
      # landing decision is mandatory and derived from trusted repository
      # changes (a pending proposal removed / numbered history changed) or a
      # trusted policy variable, never from an optional marker that a landing PR
      # can omit. The optional [final-landing] marker may only add final
      # validation, and it is read only as an exact standalone line of a pull
      # request body: a commit message or prose that mentions it must not select
      # final, or a push to main fails on proposals that were never removed
      # (main run 40403380987). Push events have no marker input at all.
      # Final acceptance runs on the exact head commit, compares the
      # observed checkout with the event head as independent inputs, and
      # requires every prerequisite lane to have recorded that same checkout.
      # Receipts are collected across attempts (a failed-job re-run only
      # re-executes failed lanes) and each accepted receipt is matched to the
      # attempt GitHub reports as a successful job of this run at this SHA.
      # This is a step of the required foundation context, so it cannot be
      # bypassed by a green lane aggregate alone.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Fetch every lane job result of this run across attempts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # A failed-job re-run only re-executes the matrix jobs that failed, so
          # lanes that passed keep receipts from an earlier attempt.  Collect the
          # job results of every attempt, not just the current one, so a receipt
          # can be matched to the attempt GitHub actually reports as successful.
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
            --jq '.jobs[] | {id, run_id, run_attempt, name, head_sha, status, conclusion, started_at, completed_at}' \
            > "${RUNNER_TEMP}/lane-jobs.jsonl"
          test -s "${RUNNER_TEMP}/lane-jobs.jsonl"
      - name: Collect the exact tested checkout identity of every lane
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          # Every attempt of this run, never only the current one.  Artifacts are
          # kept in per-attempt directories so the same lane can have receipts
          # from both a failed attempt and the re-run that succeeded.
          pattern: lane-identity-${{ github.run_id }}-*
          path: ${{ runner.temp }}/lane-identities
      - name: Derive the landing decision from trusted repository changes
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$EVENT_HEAD_SHA" ]; then
            echo "FAIL: checkout $HEAD_SHA is not the event head $EVENT_HEAD_SHA" >&2
            exit 1
          fi
          case "$BASE_SHA" in
            0000000000000000000000000000000000000000) BASE_SHA='' ;;
          esac
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$BASE_SHA"
          fi
          CHANGED="${RUNNER_TEMP}/changed-migrations.txt"
          : > "$CHANGED"
          if [ -n "$BASE_SHA" ]; then
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || {
              echo "FAIL: no merge base between $BASE_SHA and $HEAD_SHA" >&2; exit 1; }
            git diff --name-status "$MERGE_BASE" "$HEAD_SHA" -- migrations > "$CHANGED"
          fi
          echo "migration changes between ${BASE_SHA:-<none>} and ${HEAD_SHA}:"
          cat "$CHANGED"
      - name: Detect a standalone landing marker in the pull request body
        id: marker
        env:
          # Push events have no pull request body, so this is empty there and
          # the mode comes only from trusted reasons or FINAL_LANDING_POLICY.
          FINAL_LANDING_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          # Exact standalone line only: a mention inside prose must not select
          # final landing mode (issue 434). Never read commit messages here.
          value="$(python3 scripts/final_landing_marker.py)"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
      - name: Final landing or proposal receipt (exact head SHA, trusted mode)
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FINAL_LANDING: ${{ steps.marker.outputs.value }}
          FINAL_LANDING_POLICY: ${{ vars.FINAL_LANDING_POLICY || '' }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python3 scripts/check_landing.py --mode auto \
            --sha "$HEAD_SHA" \
            --expected-sha "$EVENT_HEAD_SHA" \
            --changed-paths "${RUNNER_TEMP}/changed-migrations.txt" \
            --lane-identities "${RUNNER_TEMP}/lane-identities" \
            --lane-jobs "${RUNNER_TEMP}/lane-jobs.jsonl" \
            --receipt final-landing-receipt.json
      # Artifact names are immutable for a run: a full re-run must upload its
      # own attempt's receipt (run_attempt is in every name) instead of
      # colliding with the previous attempt and failing the job even though
      # validation passed.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: final-landing-${{ github.run_id }}-${{ github.run_attempt }}
          path: final-landing-receipt.json
          if-no-files-found: warn
          retention-days: 14

  # Generated code is never hand-merged: on drift this job uploads the exact patch
  # produced by the pinned generators; apply it with scripts/apply_generated_patch.sh.
  # PR code is untrusted here: read-only token, no secrets, nothing is committed.
  generated-patch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Patch must apply to the contributor's branch, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: sqlc v1.31.1 (verified release artifact)
        run: |
          curl -fsSL --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sqlc-bin
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/sqlc-bin
          sudo install -m 0755 /tmp/sqlc-bin/sqlc /usr/local/bin/sqlc
      - name: Regenerate OpenAPI Go (oapi-codegen v2.8.0), sqlc and TS client (openapi-typescript)
        run: |
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          # sqlc never deletes outputs of removed/renamed query files: start from a clean output set.
          rm -f internal/db/db.go internal/db/models.go internal/db/*.sql.go
          sqlc generate
          bun packages/api-client/node_modules/openapi-typescript/bin/cli.js api/openapi.yaml -o packages/api-client/src/schema.d.ts
      - name: Collect drift as a patch
        id: drift
        run: |
          paths=(internal/platform/httpapi/generated internal/db packages/api-client/src/schema.d.ts)
          git add -N -- "${paths[@]}"
          git diff --binary -- "${paths[@]}" > generated.patch
          if [ -s generated.patch ]; then echo "drift=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.drift.outputs.drift == '1'
        with:
          name: generated-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated.patch
          if-no-files-found: error
          retention-days: 14
      - name: Fail on generated-code drift
        if: steps.drift.outputs.drift == '1'
        run: |
          git diff --stat -- internal/platform/httpapi/generated internal/db packages/api-client/src/schema.d.ts
          echo "::error::Generated code drift. Do not hand-edit: scripts/apply_generated_patch.sh ${{ github.run_id }} (artifact: generated-patch-${{ github.run_id }}-${{ github.run_attempt }})"
          exit 1

  frontend:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://postgres:ci_test_only@postgres:5432/opensite?sslmode=disable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # pull_request: HEAD^1 of the merge ref is the base. push: full history so github.event.before is checked
          # as an ancestor and every pushed commit's goldens are verified (else all goldens are).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: Trust the checked-out CI workspace for Go VCS metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Bun archive extraction prerequisite
        run: ./scripts/ci_apt_install.sh --no-install-recommends unzip postgresql-client
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: go mod download
      - run: bun install --frozen-lockfile
      - name: Types, token generation, style policy and contrast
        run: bash scripts/check_frontend.sh
      - name: Golden provenance (records, pins, hashes; changed goldens against their CI producer)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENSITE_GOLDEN_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          bun scripts/frontend/check-baselines.ts
          bun scripts/frontend/verify-baseline-artifact.ts
      # C-08e: pixels must not depend on the host CPU (see RENDERING.chromiumArgs); log it to correlate any diff.
      - name: Runner CPU (raster diagnostics)
        run: grep -m1 'model name' /proc/cpuinfo; grep -o -m1 -w 'avx512f' /proc/cpuinfo || echo 'no avx512f'
      - name: Candidate visual/a11y comparison against committed goldens
        id: visual
        env:
          OPENSITE_ORPHAN_CHECK: '1'
        run: bun run visual:test
      - name: Comparison receipt (CI artifact and summary only)
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/frontend/comparison-receipt.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: frontend-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparison-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: frontend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Explicit CI-only golden update: re-renders only scopes whose comparison fails.
  # Download this artifact and commit its PNGs; the ordinary frontend check still
  # compares against the committed golds.
  frontend-baselines:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[visual-baseline-update]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    env:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://postgres:ci_test_only@postgres:5432/opensite?sslmode=disable
      OPENSITE_BASELINE_UPDATE: '1'
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Trust the checked-out CI workspace for Go VCS metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Bun archive extraction prerequisite
        # The golden producer may not run repository code before its writer
        # (scripts/frontend/workflow-provenance.ts), so the bounds are inlined here.
        run: timeout 180 apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && timeout 300 apt-get install -y -qq --no-install-recommends unzip postgresql-client
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: go mod download
      # No repository code may run before the writer (workflow-provenance.ts); it builds what it renders.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate golden images in pinned CI container
        run: bun run visual:update
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/frontend/baselines
          if-no-files-found: error
          retention-days: 90
