name: foundation-contracts
on: [push, pull_request]

# PR commits are validated by the pull_request run only; push runs of non-main
# branches exist solely for the [visual-baseline-update] producer job.
concurrency:
  # main runs get unique groups so no queued main run is ever replaced.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One required CI job. No costly SKU/performance suite on every commit.
jobs:
  foundation:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      JOBS_REQUIRE_PG: '1'
      IDEMPOTENCY_REQUIRE_PG: '1'
      OUTBOX_REQUIRE_PG: '1'
      OPENSITE_REQUIRE_PGX_FIXTURES: '1'
      CUSTOMER_AUTH_REQUIRE_PG: '1'
      DATABASE_URL: postgres://postgres:ci_test_only@localhost:5432/opensite?sslmode=disable
      C07_FIXTURE_PASSWORD: ci_catalog_test_only
      C07_DATABASE_URL: postgres://c07_runtime:ci_catalog_test_only@localhost:5432/opensite?sslmode=disable
      C07_MEDIA_DATABASE_URL: postgres://c07_media:ci_catalog_test_only@localhost:5432/opensite?sslmode=disable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Land in-development migrations in this ephemeral checkout only
        run: python3 scripts/pending_migrations.py ci-normalize
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Go / PageGraph / LocalFS / Tenant Transaction
        run: |
          go mod download
          go test -race -count=1 ./...
          go vet ./...
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: Python tools (hash-locked)
        run: python -m pip install --quiet --require-hashes -r requirements-ci.txt
      - name: CI pin policy and offline gates
        run: |
          python3 scripts/check_ci_pins.py
          bash scripts/check_all.sh
      - name: OpenAPI structural checks
        run: |
          python scripts/check_contract.py
          openapi-spec-validator api/openapi.yaml
      - name: Pinned strict OpenAPI generation and drift gate
        run: |
          python3 scripts/check_oapi_codegen.py
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code -- internal/platform/httpapi/generated/api.gen.go
          test -z "$(git status --porcelain --untracked-files=all -- internal/platform/httpapi/generated/api.gen.go)"
      - name: PostgreSQL 18 forward-only migrations and security
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          ./scripts/check_pg.sh
          python3 tests/test_inventory_race_sync.py
          ./scripts/check_pg_races.sh
          ./scripts/check_pg_upgrade.sh
      - name: Privacy column registry and persisted canary coverage
        run: python3 scripts/privacy_registry.py --database --fixture
      - name: Catalog/media real HTTP gates with isolated role logins
        env:
          OPENSITE_DISPOSABLE_PG: '1'
        run: ./scripts/check_catalog_api.sh
      - name: Go pgx-tagged vet and race tests
        run: |
          # Restore the committed isolated fixture after its HTTP mutation tests.
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f tests/fixtures/catalog_api.sql
          auth_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$auth_secret"
          export CUSTOMER_AUTH_FIXTURE_SECRET="$auth_secret"
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f tests/fixtures/customer_auth.sql
          export CUSTOMER_AUTH_TEST_DATABASE_URL="postgresql://c05b_customer:$auth_secret@localhost:5432/opensite?sslmode=disable"
          printf '%s\n' "CUSTOMER_AUTH_TEST_DATABASE_URL=$CUSTOMER_AUTH_TEST_DATABASE_URL" >> "$GITHUB_ENV"
          go vet -tags pgx ./...
          go test -race -tags pgx -count=1 ./...
      - name: sqlc v1.31.1 (verified release artifact)
        run: |
          curl -fsSL --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sqlc-bin
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/sqlc-bin
          sudo install -m 0755 /tmp/sqlc-bin/sqlc /usr/local/bin/sqlc
          sqlc version
      - name: Typechecked pgx v5/sqlc integration and generated-code cleanliness
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f tests/fixtures/catalog_api.sql
          ./scripts/check_codegen.sh
          # Generated code and module files must be committed, not regenerated differently per build.
          git diff --exit-code -- go.mod go.sum internal/db
          if [ -n "$(git status --porcelain --untracked-files=all -- internal/db)" ]; then
            echo "FAIL: internal/db differs from committed sqlc output"
            git status --short --untracked-files=all -- internal/db
            exit 1
          fi

  frontend:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://postgres:ci_test_only@postgres:5432/opensite?sslmode=disable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # pull_request: HEAD^1 of the merge ref is the base. push: full history so github.event.before is checked
          # as an ancestor and every pushed commit's goldens are verified (else all goldens are).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: Trust the checked-out CI workspace for Go VCS metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Bun archive extraction prerequisite
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip postgresql-client
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: go mod download
      - run: bun install --frozen-lockfile
      - name: Types, token generation, style policy and contrast
        run: bash scripts/check_frontend.sh
      - name: Golden provenance (records, pins, hashes; changed goldens against their CI producer)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENSITE_GOLDEN_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          bun scripts/frontend/check-baselines.ts
          bun scripts/frontend/verify-baseline-artifact.ts
      - name: Candidate visual/a11y comparison against committed goldens
        id: visual
        run: bun run visual:test
      - name: Comparison receipt (CI artifact and summary only)
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/frontend/comparison-receipt.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: frontend-comparison-${{ github.run_id }}
          path: comparison-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: frontend-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Explicit CI-only golden update: re-renders only scopes whose comparison fails.
  # Download this artifact and commit its PNGs; the ordinary frontend check still
  # compares against the committed golds.
  frontend-baselines:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[visual-baseline-update]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    env:
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://postgres:ci_test_only@postgres:5432/opensite?sslmode=disable
      OPENSITE_BASELINE_UPDATE: '1'
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Trust the checked-out CI workspace for Go VCS metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Bun archive extraction prerequisite
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip postgresql-client
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: go mod download
      # No repository code may run before the writer (workflow-provenance.ts); it builds what it renders.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate golden images in pinned CI container
        run: bun run visual:update
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-baselines-${{ github.run_id }}
          path: tests/frontend/baselines
          if-no-files-found: error
          retention-days: 90
