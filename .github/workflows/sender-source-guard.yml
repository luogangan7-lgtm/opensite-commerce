name: sender-source-guard
on:
  pull_request:
  push:
    branches: [feat/apparel-b2b-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-source-binding:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Owned loopback source-binding gate
        run: |
          mkdir -p evidence/sender-source-guard
          git rev-parse HEAD > evidence/sender-source-guard/source-sha.txt
          set -o pipefail
          timeout 120 node --test work/apparel-b2b/fleet-20261104/detail-20261110/sender-g/source-guard.test.cjs work/apparel-b2b/fleet-20261104/detail-20261110/sender-g/run-admission.test.cjs 2>&1 | tee evidence/sender-source-guard/raw.log
      - name: Existing offline attempt regression
        run: timeout 60 node work/apparel-b2b/fleet-20261104/detail-20261110/sender-g/test-offline.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: sender-source-guard-evidence
          path: evidence/sender-source-guard/
          if-no-files-found: warn
