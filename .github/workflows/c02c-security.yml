# Responsibility: independent CI evidence for C-02c security branches before contract/codegen gates.
# Dependencies: pinned Go and disposable PostgreSQL; never runs on a developer host.
name: c02c-security
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: Session and key security regressions
        run: go test -v -race -count=1 -run 'TestC02c' ./internal/modules/identity/internal/httpapi ./internal/platform/httpapi ./internal/bootstrap
  security-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: opensite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d opensite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOTOOLCHAIN: local
      OPENSITE_REQUIRE_PGX_FIXTURES: '1'
      DATABASE_URL: postgres://postgres:ci_test_only@localhost:5432/opensite?sslmode=disable
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.27.2'
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Real role capabilities and write authority regressions
        run: go test -v -race -tags pgx -count=1 -timeout=10m -run 'TestC02c' ./internal/modules/identity
  security-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Hash-locked Python dependencies
        run: python3 -m pip install --quiet --require-hashes -r requirements-ci.txt
      - name: API key contract regression and mutation probes
        run: python3 tests/test_identity_login_contract.py
