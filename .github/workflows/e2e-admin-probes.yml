# Temporary CI-only fault probes; never merge this workflow.
name: e2e-admin-fault-probes
on:
  pull_request:
    paths: ['.github/workflows/e2e-admin-probes.yml']
permissions:
  contents: read
jobs:
  orders-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fault: [etag, tenant-path]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: Control - unmodified current orders contract
        run: bun test web/admin/src/orders.test.ts
      - name: Inject one isolated fault
        env:
          FAULT: ${{ matrix.fault }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          path = Path('web/admin/src/orders.tsx')
          source = path.read_text()
          if os.environ['FAULT'] == 'etag':
              lines = source.splitlines(keepends=True)
              targets = [line for line in lines if "if (response.headers.get('ETag')" in line]
              if len(targets) != 1: raise SystemExit('Expected exactly one ETag guard')
              source = source.replace(targets[0], '')
          else:
              target = 'tenant_id: uuid(tenantId)'
              if source.count(target) != 2: raise SystemExit('Expected list/detail tenant paths')
              source = source.replace(target, "tenant_id: '22222222-2222-4222-8222-222222222222'")
          path.write_text(source)
          PYTHON
      - name: Mutant must turn the actual contract tests RED
        run: bun test web/admin/src/orders.test.ts
