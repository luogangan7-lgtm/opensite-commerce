# Responsibility: nonrequired CI-only full-stack MVP browser acceptance.
# Dependencies: existing frozen Bun dependencies and pinned operations images.
# Invariants: genuine failure stays red; isolated stack cleanup and evidence on every exit.
name: mvp-e2e
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mvp-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - name: Install the existing frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build and exercise the disposable full stack
        run: python3 scripts/e2e/run.py --receipt-dir work/C24a/ci
      - name: Reuse the real disposable backup volume-loss restore drill
        run: bash scripts/ops_drill.sh --receipt-dir work/C24a/ci/drill
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: mvp-e2e-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/C24a/ci
            test-results/e2e
            playwright-report/e2e
          retention-days: 7
