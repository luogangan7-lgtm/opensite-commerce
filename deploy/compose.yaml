# V0.7 migration-test infrastructure ONLY, not a complete storefront deployment.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: opensite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql
      - ../migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opensite"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  pg_data:
