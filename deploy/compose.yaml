# Local rehearsal only. One application database per cluster; see README.md.
services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${OPENSITE_DB:-opensite}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql
      - ../migrations:/migrations:ro
      - ../:/workspace:ro
      - media_data:/media
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    environment:
      OPENSITE_DB: ${OPENSITE_DB:-opensite}
      OPENSITE_DB_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      OPENSITE_RUNTIME_DB_PASSWORD: ${OPENSITE_RUNTIME_DB_PASSWORD:?set runtime password}
      OPENSITE_AUTH_DB_PASSWORD: ${OPENSITE_AUTH_DB_PASSWORD:?set auth password}
      OPENSITE_DOMAIN_DB_PASSWORD: ${OPENSITE_DOMAIN_DB_PASSWORD:?set domain password}
      OPENSITE_MEDIA_DB_PASSWORD: ${OPENSITE_MEDIA_DB_PASSWORD:?set media password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      OSC_API_ADDR: :8080
      OPENSITE_DB_HOST: postgres
      OPENSITE_DB: ${OPENSITE_DB:-opensite}
      OPENSITE_RUNTIME_DB_PASSWORD: ${OPENSITE_RUNTIME_DB_PASSWORD:?set runtime password}
      OPENSITE_AUTH_DB_PASSWORD: ${OPENSITE_AUTH_DB_PASSWORD:?set auth password}
      OPENSITE_DOMAIN_DB_PASSWORD: ${OPENSITE_DOMAIN_DB_PASSWORD:?set domain password}
      OPENSITE_MEDIA_DB_PASSWORD: ${OPENSITE_MEDIA_DB_PASSWORD:?set media password}
      OPENSITE_MEDIA_ROOT: /var/lib/opensite/media
    volumes:
      - media_data:/var/lib/opensite/media
    ports:
      - "127.0.0.1:${OPENSITE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  # PR #25 is not in this base: explicitly opt-in placeholder, never a fake worker.
  worker:
    profiles: ["pending-worker"]
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["/bin/sh", "-c", "echo 'NOT_RUN: River/outbox worker pending PR25 integration'; exit 78"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
# Astro SSR has not merged; storefront is omitted until C-09a integration.
volumes:
  pg_data:
  media_data:
