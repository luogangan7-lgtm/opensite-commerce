version: "2"
sql:
  - engine: "postgresql"
    # sqlc consumes schema DDL, not the role-policy DO blocks of migration 008.
    schema:
      - "migrations/001_identity.sql"
      - "migrations/002_site.sql"
      - "migrations/003_catalog.sql"
      - "migrations/004_media.sql"
      - "migrations/005_cms.sql"
      - "migrations/006_publish.sql"
      - "migrations/007_reliability.sql"
      - "migrations/010_security_hardening.sql"
      - "migrations/011_platform_reliability.sql"
      - "migrations/012_inventory.sql"
      - "migrations/013_money_pricing.sql"
      - "migrations/014_shipping.sql"
      - "migrations/015_tax.sql"
      - "migrations/016_customers_b2b.sql"
      - "migrations/017_ledger.sql"
      - "migrations/018_catalog_api.sql"
      - "migrations/019_product_media_asset_index.sql"
      - "migrations/020_orders.sql"
      - "migrations/021_queue_authorization.sql"
      - "migrations/022_reliability_limits.sql"
      - "migrations/023_cart.sql"
      - "migrations/024_ops_metrics.sql"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
